<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- PWA / TWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cannalife Co POS" />
    <meta name="application-name" content="Cannalife Co POS" />
    <meta name="msapplication-TileColor" content="#16a34a" />
    <meta name="msapplication-TileImage" content="/icon-144.png" />
    <!-- SEO -->
    <meta name="description" content="Cannalife Co POS — Point of Sale and Club Management for South African Cannabis Dispensaries" />
    <meta name="keywords" content="cannalife, pos, cannabis, club management, franchise, south africa" />
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/cannalife-icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icon-152.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <title>Cannalife Co POS</title>
    <!-- Theme init: runs before React mounts so the correct palette is on
         screen at first paint. Cannalife Co is light-only per the client — never
         add the 'dark' class, regardless of any stored preference or the
         visitor's OS setting. -->
    <script>
      (function () {
        try {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
